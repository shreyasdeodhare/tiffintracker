server {
    listen 192.168.1.101:18443 ssl default_server;
    server_name _;
    ssl_certificate /etc/tiffintrack/tls/server.crt;
    ssl_certificate_key /etc/tiffintrack/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 444;
}
server {
    listen 192.168.1.101:18443 ssl;
    server_name 192.168.1.101;
    ssl_certificate /etc/tiffintrack/tls/server.crt;
    ssl_certificate_key /etc/tiffintrack/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    allow 192.168.1.0/24;
    deny all;
    location = /auth/login {
        limit_req zone=pm_tiffintrack_private burst=15 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8087;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
    location / {
        proxy_pass http://127.0.0.1:8087;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
