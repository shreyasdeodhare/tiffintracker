{% extends "base.html" %}{% block content %}<div class="row justify-content-center"><div class="col-md-6"><div class="card card-body">
<h1 class="h4">Change password</h1><p class="text-muted">Choose a unique password with at least 12 characters.</p>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label class="form-label">Current password</label><input class="form-control mb-2" type="password" name="current_password" required>
<label class="form-label">New password</label><input class="form-control mb-2" type="password" name="new_password" minlength="12" required>
<label class="form-label">Confirm new password</label><input class="form-control mb-3" type="password" name="confirm_password" minlength="12" required>
<button class="btn btn-primary">Update password</button></form></div></div></div>{% endblock %}
