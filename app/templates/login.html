{% extends "base.html" %}{% block content %}
<div class="row justify-content-center"><div class="col-md-5 col-lg-4"><div class="card shadow-sm"><div class="card-body p-4">
<h1 class="h4 mb-3">Sign in to TiffinTrack</h1><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label class="form-label">Email</label><input class="form-control mb-3" type="email" name="email" autocomplete="username" required>
<label class="form-label">Password</label><input class="form-control mb-3" type="password" name="password" autocomplete="current-password" required>
<button class="btn btn-primary w-100">Sign in</button></form></div></div></div></div>{% endblock %}
